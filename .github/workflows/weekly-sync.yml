name: Weekly Leaderboard & Model Sync

on:
  schedule:
    # Runs every Monday at 00:00 UTC (08:00 AM Taiwan Time)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

# 同時只跑一個同步，避免兩次推送互撞
concurrency:
  group: weekly-sync
  cancel-in-progress: false

jobs:
  sync-leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pyarrow>=17,<27'

      - name: Run Leaderboard Sync Script
        run: |
          python scripts/sync_leaderboard.py

      - name: Validate data.js
        run: |
          node scripts/validate_data.mjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --staged --quiet; then
            echo "No changes detected. data.js is already up-to-date."
          else
            git commit -m "chore(data): weekly sync Arena Coding Leaderboard Elo ratings [skip ci]"
            # 同步期間 main 可能有新 commit，先 rebase 再推
            git pull --rebase origin main
            git push origin main
          fi
